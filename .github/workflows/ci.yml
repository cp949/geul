name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Install pinned Playwright browsers
        # R1 슬라이스 13(AC-05)부터 playwright.config.ts가 firefox/webkit
        # 프로젝트를 추가했고 pnpm verify(test:e2e)는 chromium·firefox·webkit
        # 셋을 명시 지정해 돈다 — 셋 다 설치해야 CI가 로컬과 같은 결과를 낸다.
        # perf 프로젝트(test:e2e:perf)는 게이트가 아니라 CI에서 돌지 않으며
        # Desktop Chrome을 쓰므로 추가 설치가 필요 없다(Issue #74).
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Verify distribution and browser flows
        run: pnpm verify
