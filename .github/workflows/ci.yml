name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Install pinned Playwright browsers
        # pnpm verify(test:e2e)는 chromium만 돈다 — firefox/webkit(`@core`
        # 부분집합)은 기본 게이트에서 제외했고 필요할 때 `test:e2e:full`로
        # 실행한다. perf 프로젝트(test:e2e:perf)는 게이트가 아니라 CI에서
        # 돌지 않으며 Desktop Chrome을 쓰므로 추가 설치가 필요 없다(Issue #74).
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify distribution and browser flows
        run: pnpm verify
