packages:
  - apps/*
  - fixtures/*
  - packages/*
# '@parcel/watcher'(@tailwindcss/cli 전이 의존성)의 install script는
# npm_config_build_from_source 없이는 no-op이고, 프리빌트 바이너리는
# optionalDependencies로 설치되며, watcher 자체가 CLI --watch 경로에서만
# lazy import된다(레포에 watch 사용처 없음) — 실행 허가가 불필요해 거부한다.
allowBuilds:
  '@parcel/watcher': false
  # core-js(@cp949/geul-demo dependency, cp949/geul#122)의 postinstall은
  # funding 안내 메시지를 출력할 뿐이다 — 실행 허가가 불필요해 거부한다.
  core-js: false
  # esbuild(@cp949/geul-react devDependency, DELTA-01)의 postinstall(install.js)은
  # optionalDependencies로 설치된 플랫폼 바이너리 패키지를 generateBinPath()가
  # require.resolve로 먼저 찾을 때만 쓰는 fallback이다. postinstall 미실행 상태에서
  # `bin/esbuild --version`이 정상 출력됨을 실측 확인했다 — 실행 허가가 불필요해 거부한다.
  esbuild: false
minimumReleaseAgeExclude:
  - '@tiptap/core@3.30.1'
  - '@tiptap/extension-blockquote@3.30.1'
  - '@tiptap/extension-bold@3.30.1'
  - '@tiptap/extension-bullet-list@3.30.1'
  - '@tiptap/extension-code-block@3.30.1'
  - '@tiptap/extension-code@3.30.1'
  - '@tiptap/extension-document@3.30.1'
  - '@tiptap/extension-dropcursor@3.30.1'
  - '@tiptap/extension-gapcursor@3.30.1'
  - '@tiptap/extension-hard-break@3.30.1'
  - '@tiptap/extension-heading@3.30.1'
  - '@tiptap/extension-horizontal-rule@3.30.1'
  - '@tiptap/extension-italic@3.30.1'
  - '@tiptap/extension-link@3.30.1'
  - '@tiptap/extension-list-item@3.30.1'
  - '@tiptap/extension-list-keymap@3.30.1'
  - '@tiptap/extension-list@3.30.1'
  - '@tiptap/extension-ordered-list@3.30.1'
  - '@tiptap/extension-paragraph@3.30.1'
  - '@tiptap/extension-strike@3.30.1'
  - '@tiptap/extension-text@3.30.1'
  - '@tiptap/extension-underline@3.30.1'
  - '@tiptap/extensions@3.30.1'
  - '@tiptap/pm@3.30.1'
  - '@tiptap/starter-kit@3.30.1'
patchedDependencies:
  micromark-extension-gfm-table@2.1.1: patches/micromark-extension-gfm-table@2.1.1.patch
# pnpm audit 권고 대응. 전이 의존성의 취약 범위만 패치 버전으로 올린다.
# 선택자가 취약 범위만 잡으므로 상위 패키지가 고친 버전을 내면 override가 필요 없어진다.
# - brace-expansion <5.0.12: GHSA-q2hr-2g5m-vwhr, GHSA-qhr7-859c-m2p7, GHSA-6j4f-fj2g-mc7p
# - source-map-js <1.2.2: GHSA-68fv-2mgg-jv7q
# - shell-quote <1.11.0: GHSA-pqg4-j6r4-53mv
overrides:
  'brace-expansion@>=4.0.0 <5.0.12': 5.0.12
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2
  'shell-quote@>=1.8.4 <1.11.0': 1.12.0
  # braces <=3.0.3(GHSA-vfj7-8cjw-p6xm)는 패치 버전이 없다. micromatch를 끌어오는
  # @parcel/watcher 2.5.x 대신 picomatch 기반인 2.6.0을 쓴다(sass optionalDependencies ^2.4.1 충족).
  '@parcel/watcher@<2.6.0': 2.6.0
